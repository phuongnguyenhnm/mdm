<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>员工码</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <script src="jquery.min.js"></script>
    <script src="jquery.qrcode.min.js"></script>
    <style>
        /* CSS hỗ trợ chống chọn văn bản để giữ màn hình mượt hơn */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .show-yellow-mode, .show-green-mode { display: none; }
        .hidden-yellow-mode, .hidden-green-mode { display: block; }

        /* === TRẠNG THÁI MẶC ĐỊNH LÀ HÌNH 2 (VÀNG) === */
        .header-box { background-color: #EABC42; } 
        .green-box-content { display: none; } 
        .yellow-box-content { display: flex; justify-content: center; align-items: center; } 

        .green-status-wrapper { display: none; } 
        .yellow-status-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; } 

        .apply-leave-link { display: none !important; } 
        .refresh-qr-center { margin-bottom: 10px; text-align: center; } 

        /* === TRẠNG THÁI CHUYỂN SANG HÌNH 1 (XANH LÁ) === */
        body.green-mode .header-box { background-color: #39A958; } 
        body.green-mode .green-box-content { display: flex; justify-content: center; align-items: center; }
        body.green-mode .yellow-box-content { display: none; }

        body.green-mode .green-status-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        body.green-mode .yellow-status-wrapper { display: none; }

        body.green-mode .apply-leave-link { display: inline-block !important; margin-right: 20px; font-size: 13px; color: #000; cursor: pointer; }
        body.green-mode .refresh-qr-center { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; gap: 20px; }
    </style>
</head>
<body class="yellow-mode">
    <div class="container">
        <!-- Phần tiêu đề -->
        <div class="header">
            <script>
                $(document).ready(function() {$.ajax({
                        url: 'name.txt',
                        dataType: 'text',
                    }).done(function(data) {
                        $('.header').text(data.trim());
                    }).fail(function() {
                        console.error('Không thể tải file name.txt');
                    });
                    createQRCode();
                });
            </script>
        </div>

        <!-- Hộp tiêu đề động -->
        <div class="header-box green-box yellow-box" id="modeHeaderBox">
            <div class="green-box-content" style="width: 100%; height: 100%;">
                <p>将二维码对准扫描器刷码进场</p>
            </div>
            <div class="yellow-box-content" style="width: 100%; height: 100%;">
                <p>将二维码对准扫描器刷码出场</p>
            </div>
        </div>

        <!-- Phần mã QR -->
        <div class="qr-section">
            <p class="time" id="currentDatetime"></p>         
            <script>
                function updateDateTime() {
                    const now = new Date();
                    const day = String(now.getDate()).padStart(2, '0');
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const year = now.getFullYear();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const seconds = String(now.getSeconds()).padStart(2, '0');

                    const dateString = `${year}-${month}-${day}  `;
                    const timeString = `${hours}:${minutes}:${seconds}`;
                    document.getElementById('currentDatetime').innerText = `${dateString}       ${timeString}`;
                }
                updateDateTime();
                setInterval(updateDateTime, 1000);   
            </script>

            <div class="qr-code">
                <div id="qrcode"></div>
            </div>

            <!-- Các nút bấm dưới mã QR -->
            <div id="qrLinks" class="refresh-qr-center">
                <span class="apply-leave-link" id="applyLeaveBtn">申请离场</span>
                <p class="rf" id="generate" style="margin: 0; cursor: pointer; display: inline-block;">刷新二维码</p>
            </div>
              
            <script>
                function generateRandomString(length = 200) {
                    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789=/\_-+';
                    let result = '';
                    for (let i = 0; i < length; i++) {
                        result += characters.charAt(Math.floor(Math.random() * characters.length));
                    }
                    return result;
                }

                function createQRCode() {
                    const randomData = generateRandomString(100);
                    $('#qrcode').empty();
                    $('#qrcode').qrcode({
                        text: randomData,
                        width: 240,
                        height: 240,
                        render: 'image',
                        ecLevel: 'H'
                    });
                }

                $(document).ready(function() {
                    createQRCode();
                });

                $('#generate').click(createQRCode);
            </script>

            <p class="status">已生效</p>

            <!-- Trạng thái timer ban đầu (Giờ tĩnh 20:xx:xx) -->
            <div class="yellow-status-wrapper" id="yellowTimerWrapper">
                <p class="timer" id="yellowStaticTime">20:46:47</p>         
            </div>

            <!-- Trạng thái timer đếm giây (00:00 trở đi) -->
            <div class="green-status-wrapper" id="greenTimerWrapper">
                <p class="timer" id="greenCountingTime">00:00</p>
            </div>
        </div>

        <!-- Phần thông tin -->
        <div class="info">
            <p>尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。</p>
        </div>
    </div>

    <!-- Script xử lý bấm giữ màn hình được tối ưu chống trôi/lệch cảm ứng -->
    <script>
        let pressTimer = null;
        let countingSeconds = 0;
        let countingInterval = null;
        let startX = 0;
        let startY = 0;

        const body = document.body;
        const yellowTimerWrapper = document.getElementById('yellowTimerWrapper');
        const greenTimerWrapper = document.getElementById('greenTimerWrapper');
        const countingTimeEl = document.getElementById('greenCountingTime');

        function updateCountingTimer() {
            countingSeconds++;
            const minutes = String(Math.floor(countingSeconds / 60)).padStart(2, '0');
            const seconds = String(countingSeconds % 60).padStart(2, '0');
            countingTimeEl.innerText = `${minutes}:${seconds}`;
        }

        function enableGreenMode() {
            body.classList.remove('yellow-mode');
            body.classList.add('green-mode');
            yellowTimerWrapper.style.display = 'none';
            greenTimerWrapper.style.display = 'flex';
            
            if (countingInterval) clearInterval(countingInterval);
            countingSeconds = 0;
            countingTimeEl.innerText = '00:00';
            countingInterval = setInterval(updateCountingTimer, 1000);
        }

        function enableYellowMode() {
            body.classList.remove('green-mode');
            body.classList.add('yellow-mode');
            
            yellowTimerWrapper.style.display = 'none'; 
            greenTimerWrapper.style.display = 'flex'; 

            if (countingInterval) clearInterval(countingInterval);
            countingSeconds = 0;
            countingTimeEl.innerText = '00:00';
            countingInterval = setInterval(updateCountingTimer, 1000);
        }

        function startLongPress(e) {
            if ($(e.target).closest('.rf').length > 0 || e.target.id === 'generate' || e.target.id === 'applyLeaveBtn') return;

            // Lưu lại tọa độ ban đầu khi chạm
            if (e.touches && e.touches.length > 0) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }

            if (pressTimer === null) {
                pressTimer = setTimeout(() => {
                    if (body.classList.contains('yellow-mode')) {
                        enableGreenMode();
                    } else if (body.classList.contains('green-mode')) {
                        enableYellowMode();
                    }

                    if (navigator.vibrate) {
                        navigator.vibrate(200);
                    }
                    
                    pressTimer = null;
                }, 5000);
            }
        }

        function checkTouchMove(e) {
            if (pressTimer !== null && e.touches && e.touches.length > 0) {
                const moveX = e.touches[0].clientX;
                const moveY = e.touches[0].clientY;
                // Cho phép ngón tay dịch chuyển trong phạm vi dưới 15 pixel thì vẫn tính là đang giữ, vượt quá mới hủy
                if (Math.abs(moveX - startX) > 15 || Math.abs(moveY - startY) > 15) {
                    cancelLongPress();
                }
            }
        }

        function cancelLongPress() {
            if (pressTimer !== null) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        // Lắng nghe sự kiện với passive: true để trình duyệt tối ưu hóa mượt mà cảm ứng
        window.addEventListener('mousedown', startLongPress);
        window.addEventListener('mouseup', cancelLongPress);
        window.addEventListener('mouseleave', cancelLongPress);

        window.addEventListener('touchstart', startLongPress, { passive: true });
        window.addEventListener('touchmove', checkTouchMove, { passive: true });
        window.addEventListener('touchend', cancelLongPress);
        window.addEventListener('touchcancel', cancelLongPress);
    </script>
</body>
</html>
