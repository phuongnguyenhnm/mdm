<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>员工码</title>
    <!-- Gọi file CSS riêng -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <!-- Thư viện jQuery -->
    <script src="jquery.min.js"></script>
    <script src="jquery.qrcode.min.js"></script>
</head>
<body class="yellow-mode"> <!-- Mặc định lúc mở là chế độ Vàng -->
    <div class="container">
        <!-- Phần tiêu đề -->
        <div class="header"></div>

        <!-- Hộp màu (Xanh/Vàng dùng chung class green-box để giữ nguyên kích thước/spacing gốc) -->
        <div class="green-box">
            <span class="green-content">将二维码对准扫描器刷码进场</span>
            <span class="yellow-content">将二维码对准扫描器刷码出场</span>
        </div>

        <!-- Phần mã QR -->
        <div class="qr-section">
            <p class="time" id="currentDatetime"></p>         

            <div class="qr-code">
                <div id="qrcode"></div>
            </div>

            <!-- Các liên kết dưới mã QR -->
            <div class="qr-links-wrapper">
                <span class="apply-leave-btn" id="applyLeaveBtn" style="font-size: 13px; color: #000; cursor: pointer;">申请离场</span>
                <p class="rf" id="generate" style="margin: 0;">刷新二维码</p>
            </div>

            <p class="status">已生效</p>

            <!-- Bộ đếm thời gian -->
            <p class="timer timer-counting" id="countingTimer">00:00</p>
        </div>

        <!-- Phần thông tin -->
        <div class="info">
            <p>尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。</p>
        </div>
    </div>

    <!-- Gọi file JavaScript riêng -->
    <script src="script.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').then((registration) => {
                    console.log('Service Worker registered with scope:', registration.scope);
                }).catch((error) => {
                    console.error('Service Worker registration failed:', error);
                });
            });
        }
    </script>
</body>
</html>
